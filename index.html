<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SaleFlow — анализ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="app">
        <!-- ШАПКА -->
        <div class="app-header">
            <div class="logo">
                <span>🌊</span> SaleFlow
            </div>
            <div class="badge" id="subscription-badge">Бесплатно</div>
        </div>

        <!-- ЭКРАН 1: ВВОД ДИАЛОГА -->
        <div id="step-upload">
            <h2 class="step-title">Вставьте диалог с клиентом</h2>
            <p class="step-subtitle">Мы проанализируем его по 30 критериям и покажем, где вы теряете клиентов.</p>

            <textarea id="dialog-input" class="dialog-textarea" rows="6" placeholder="Клиент: Здравствуйте!&#10;Вы: Добрый день!&#10;Клиент: Сколько стоит?"></textarea>

            <span class="templates-label">Или выберите шаблон:</span>
            <div class="templates-scroll">
                <button class="template-chip" data-template="ecommerce">🛍️ E‑commerce</button>
                <button class="template-chip" data-template="services">💼 Услуги</button>
                <button class="template-chip" data-template="b2b">🏢 B2B</button>
                <button class="template-chip" data-template="cold">❄️ Холодный контакт</button>
            </div>

            <button id="analyze-btn" class="btn-primary">🔍 Анализировать</button>
            <button id="example-btn" class="btn-secondary">📋 Вставить пример</button>

            <div class="footer-note">⏱️ Анализ до 60 секунд • Результаты сохраняются</div>
        </div>

        <!-- ЭКРАН 2: РЕЗУЛЬТАТЫ (скрыт) -->
        <div id="step-result" class="hidden">
            <!-- сюда вставляется результат через JS -->
        </div>

        <!-- TOAST-УВЕДОМЛЕНИЕ -->
        <div id="toast" class="toast">✅ Скопировано!</div>
    </div>

    <script src="script.js"></script>
    <script>
        // Обновление бейджа подписки (по параметру sub)
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const hasSub = urlParams.get('sub') === '1';
            const badge = document.getElementById('subscription-badge');
            if (hasSub) {
                badge.textContent = '⭐ Pro';
                badge.style.borderColor = '#f5a623';
                badge.style.color = '#f5a623';
            }
        })();
    </script>

</body>
</html>
